name: Wahoo URL-test Core Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Race-test selection and provider changes
        run: go test -race -tags with_gvisor ./adapter/outboundgroup -count=1
